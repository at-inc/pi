name: Publish GitHub Packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      libraries_only:
        description: Publish only pi-ai and pi-agent-core
        type: boolean
        default: false
      durable_only:
        description: Publish only fork Durable and Chord (exclusive with libraries_only)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@at-inc"
          cache: npm

      - name: Setup Bun
        if: ${{ inputs.libraries_only || inputs.durable_only }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup pnpm
        if: ${{ inputs.durable_only }}
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Hydrate model data
        if: ${{ inputs.libraries_only || inputs.durable_only }}
        run: npm run hydrate:model-data

      - name: Build
        run: npm run ${{ (inputs.libraries_only || inputs.durable_only) && 'build:offline' || 'build' }}

      - name: Check
        run: npm run check

      - name: Build the pi-env daemon
        run: npm run build:daemon --workspace packages/env

      - name: Test
        run: ./test.sh

      - name: Verify local library installation
        if: ${{ inputs.libraries_only }}
        run: node scripts/check-library-install.mjs

      - name: Verify local Durable installation
        if: ${{ inputs.durable_only }}
        run: node scripts/check-durable-install.mjs

      - name: Publish packages
        run: node scripts/publish-github-packages.mjs ${{ inputs.libraries_only && '--libraries-only' || '' }} ${{ inputs.durable_only && '--durable-only' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published library installation
        if: ${{ inputs.libraries_only }}
        run: node scripts/check-library-install.mjs --registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published Durable installation
        if: ${{ inputs.durable_only }}
        run: node scripts/check-durable-install.mjs --registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
