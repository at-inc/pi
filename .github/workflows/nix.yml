name: Nix

# Validate fork packaging on PRs, release tags, and a daily schedule.
# Non-release builds refresh stale catalog pins only in the runner checkout;
# release tags use their committed pin. This workflow never writes branches.

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nix.yml'
      - 'flake.lock'
      - 'flake.nix'
      - 'nix/**'
      - 'package-lock.json'
      - 'packages/*/package.json'
      - 'packages/coding-agent/install-lock/**'
      - 'packages/ai/scripts/hydrate-model-catalog.ts'
      - 'packages/ai/scripts/fork-model-data.ts'
      - 'packages/ai/scripts/fork-model-fallbacks.ts'
      - 'scripts/update-model-catalog-pin.mjs'
  # Catches packaging drift from changes pushed to main without a pull request.
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nix-${{ (github.event_name == 'pull_request' || github.ref_type == 'tag') && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.pin.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Refresh the model catalog pin if stale
        id: pin
        run: |
          set -euo pipefail
          # A release tag must build with its committed pin; it cannot be changed.
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            node scripts/update-model-catalog-pin.mjs --if-stale
          fi
          revision="$(node -p 'require("./nix/model-catalog.json").revision')"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] && ! git diff --quiet -- nix/model-catalog.json; then
            echo "::warning::The committed model catalog pin is stale; this build uses ${revision} without updating the branch."
          fi

  build:
    needs: pin
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the resolved model catalog pin
        env:
          REVISION: ${{ needs.pin.outputs.revision }}
        run: |
          printf '{\n  "revision": "%s"\n}\n' "${REVISION}" > nix/model-catalog.json

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Evaluate all systems
        if: ${{ matrix.system == 'x86_64-linux' }}
        run: nix flake check --all-systems --no-build

      - name: Build
        run: nix build -L .

      - name: Smoke-test
        run: |
          ./result/bin/pi --version
          ./result/bin/pi --help > /dev/null
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "$(./result/bin/pi --version)" = "${GITHUB_REF_NAME#v}"
          fi
