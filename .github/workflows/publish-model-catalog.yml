name: Publish Model Catalog

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  pull_request:
    paths:
      - '.github/workflows/publish-model-catalog.yml'
      - '.gitignore'
      - 'package.json'
      - 'packages/ai/**'
      - 'scripts/publish-model-catalog.mjs'
  # Aside consumes this catalog from its own R2 bucket. Publish hourly so model
  # availability is not coupled to pi.dev's business-hours release window.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit, branch, or tag to generate from'
        required: false
        default: 'main'
        type: string
      publish:
        description: 'Upload the generated catalog to production R2'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ github.event.workflow_run.head_sha || inputs.source_ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate model catalog JSON
        run: npm run generate:model-catalog

      - name: Validate model catalog JSON
        run: npm run check:model-catalog

      - name: Upload model catalog JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-catalog-json
          path: .artifacts/model-catalog
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    needs: generate
    runs-on: ubuntu-latest
    environment: pi-model-upload
    concurrency:
      group: publish-aside-model-catalog-r2
      cancel-in-progress: true
    env:
      SOURCE_REF: ${{ github.event.workflow_run.head_sha || inputs.source_ref || github.sha }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      R2_ENDPOINT: https://c27bc2275be6cd4b6b94d6978b0edf19.r2.cloudflarestorage.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Download model catalog JSON
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: model-catalog-json
          path: .artifacts/model-catalog

      - name: Verify AWS CLI
        run: aws --version

      - name: Publish model catalog to R2
        run: |
          node scripts/publish-model-catalog.mjs \
            --input .artifacts/model-catalog \
            --bucket browser-assets \
            --endpoint "$R2_ENDPOINT" \
            --source-commit "$(git rev-parse HEAD)"
