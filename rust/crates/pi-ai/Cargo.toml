[package]
name = "pi-ai"
description = "Rust port of @at-inc/pi-ai: unified LLM API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
native = ["pi-host/native", "dep:tokio", "dep:zstd"]

[dependencies]
pi-host = { workspace = true }
pi-telemetry = { workspace = true }
pi-schema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
rand = { workspace = true }
pin-project-lite = { workspace = true }
aws-sigv4 = { workspace = true }
aws-smithy-eventstream = { workspace = true }
aws-smithy-types = { workspace = true }
aws-credential-types = { workspace = true }
tokio = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[dev-dependencies]
pi-host = { workspace = true, features = ["testing"] }
futures = { workspace = true, features = ["executor"] }

[build-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
