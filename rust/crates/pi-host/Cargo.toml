[package]
name = "pi-host"
description = "Host platform layer for the pi Rust port: I/O, clocks, environment, abort signals, and JavaScript-compatible helpers"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
native = ["dep:tokio", "dep:reqwest", "dep:tokio-tungstenite"]
testing = ["futures/executor"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
ryu-js = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
